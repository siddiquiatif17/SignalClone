services:
  - type: web
    name: signal-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./signal_clone.db
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
